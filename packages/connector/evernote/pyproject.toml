[project]
name = "cognee-community-connector-evernote"
version = "0.1.0"
description = "Evernote data-source connector for cognee"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cognee>=1.6.3,<2",
  "dlt[sqlalchemy]>=1.9.0,<2",
  "evernote-plus==1.28.1.dev2",
  "httpx>=0.27,<1",
  "oauthlib>=3.2,<4",
]
readme = "README.md"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_evernote"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["N802"]

