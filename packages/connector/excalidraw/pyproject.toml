[project]
name = "cognee-community-connector-excalidraw"
version = "0.1.0"
description = "Excalidraw diagram data-source connector for Cognee — extract system architectures, visual workflows, and entity relationships into AI memory"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
license = { text = "MIT" }
dependencies = [
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[project.scripts]
cognee-excalidraw = "cognee_community_connector_excalidraw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_excalidraw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
