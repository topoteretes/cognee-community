[project]
name = "cognee-community-connector-browser"
version = "0.1.0"
description = "Browser history & bookmarks data-source connector for cognee — sync your browser research trail into memory"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee "document-mode" (DOCUMENT_SOURCE_ATTR, PIPELINE_SCOPE_ATTR,
    # and cognee_node_set routing pages through cognify with per-row node sets)
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_browser"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
