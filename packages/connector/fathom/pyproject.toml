[project]
name = "cognee-community-connector-fathom"
version = "0.1.0"
description = "Fathom data-source connector for cognee — sync your meeting notes, decisions and action items into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # needs document-mode sources with per-row node sets (DOCUMENT_SYNC_VERSION 2)
    "cognee>=1.6.3,<2",
    # cognee pins the dlt range it supports
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "responses>=0.25,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_fathom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
