[project]
name = "cognee-community-connector-box"
version = "0.1.0"
description = "Box document source with event-cursor sync and confirmed deletion"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["cognee==1.6.3", "dlt[sqlalchemy]>=1.9.0,<1.31", "boxsdk[jwt]>=3.14,<4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_box"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
