[project]
name = "cognee-community-connector-openlineage"
version = "0.1.0"
description = "OpenLineage / Marquez data-source connector for cognee — sync data pipeline lineage, job topologies, and dataset schemas into memory (full snapshot + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee document-mode (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources
    # routing lineage records through cognify instead of the dlt-schema path).
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27.0,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_openlineage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
