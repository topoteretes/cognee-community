[project]
name = "cognee-community-hybrid-adapter-arcadedb"
version = "0.2.0"
description = "ArcadeDB hybrid (graph + vector) database adapter for cognee"
authors = [
    {name = "Luca Garulli", email = "l.garulli@arcadedata.com"},
]
dependencies = [
    "cognee>=0.5.2",
    "aiohttp>=3.9.0",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[project.optional-dependencies]
bolt = ["neo4j>=5.0.0"]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://arcadedb.com"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
