[project]
name = "cognee-community-connector-jsr"
version = "0.1.0"
description = "JSR (JavaScript Registry) data-source connector for cognee — sync TypeScript/JavaScript package metadata, documentation, and exports into knowledge graphs (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cognee>=1.6.3,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.28.0,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23,<2"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_jsr"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
