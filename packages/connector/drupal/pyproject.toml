[project]
name = "cognee-community-connector-drupal"
version = "0.1.0"
description = "Drupal CMS content and documentation data-source connector for Cognee"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dlt>=1.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_drupal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
