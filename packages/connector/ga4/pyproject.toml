[project]
name = "cognee-community-connector-ga4"
version = "0.1.0"
description = "Google Analytics 4 data-source connector for cognee — sync a property's custom definitions, key events, audiences and annotations into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # needs table-scoped dlt document cleanup (PIPELINE_SCOPE_ATTR), first shipped in cognee 1.6.1
    "cognee==1.6.4",
    "dlt[sqlalchemy]>=1.9.0,<1.31",
    # ships the analyticsadmin v1beta and v1alpha discovery documents, so no discovery fetch
    "google-api-python-client>=2.100.0,<3",
    "google-auth>=2.23.0,<3",
    "google-auth-httplib2>=0.2.0,<1",
    "httplib2>=0.22.0,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_ga4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# the fake admin service mirrors the discovery client (customDimensions(), pageSize=...)
"tests/**" = ["N802", "N803"]
