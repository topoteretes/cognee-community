[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognee-community-connector-pinboard"
version = "0.1.0"
description = "Pinboard bookmarking and reading list data connector for Cognee"
readme = "README.md"
authors = [{ name = "Bhomvrat Rai", email = "bhomvratrai@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
