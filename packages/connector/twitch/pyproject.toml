[project]
name = "cognee-community-connector-twitch"
version = "0.1.0"
description = "Incremental Twitch follows, VODs and clips as Cognee documents"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "cognee>=1.6.6,<2",
    "dlt[sqlalchemy]>=1.9,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_twitch"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
