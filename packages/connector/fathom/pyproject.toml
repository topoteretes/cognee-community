[project]
name = "cognee-community-connector-fathom"
version = "0.1.0"
description = "Fathom meeting connector for Cognee with incremental sync and deletion reconciliation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.3.0",
    "requests>=2.31.0,<3",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "responses>=0.25.0"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_fathom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]



