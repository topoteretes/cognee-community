[project]
name = "cognee-community-vector-adapter-opensearch"
version = "0.1.2"
description = "OpenSearch vector database adapter for cognee"
readme = "README.md"
requires-python = "<=3.13,>=3.10"
dependencies = [
    "opensearch-py==3.0.0",
    "cognee>=1.1.0,<2.0.0",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[project.urls]
Homepage = "https://www.cognee.ai"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/dist",
  "/.venv",
]
