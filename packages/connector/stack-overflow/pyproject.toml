[project]
name = "cognee-community-connector-stack-overflow"
version = "0.1.0"
description = "Stack Overflow data-source connector for cognee — ingest questions, answers, and accepted solutions by tag."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Requires cognee "document-mode" (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources),
    # first shipped in cognee 1.4.0.
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31.0",
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_stack_overflow"]