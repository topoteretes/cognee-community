[project]
name = "cognee-community-connector-jupyter"
version = "0.1.0"
description = "Jupyter Notebook (.ipynb) data-source connector for cognee — ingest notebooks, code, markdown prose, and outputs into memory (full snapshot + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_jupyter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
