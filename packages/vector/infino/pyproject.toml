[project]
name = "cognee-community-vector-adapter-infino"
version = "0.1.0"
description = "Infino vector database adapter for cognee: embedded retrieval over Parquet, on a local path or object storage"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "infino>=0.6,<0.7",
    "pyarrow>=17",
    "cognee==1.4.2",
    # Transitive via cognee; pinned to the version cognee 1.4.2 locks (litellm
    # 1.96.x published cp310-only wheels, uninstallable on the CI's Python 3.11).
    "litellm==1.89.2",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cognee_community_vector_adapter_infino*"]
