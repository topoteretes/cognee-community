[project]
name = "cognee-community-connector-redshift"
version = "0.1.0"
description = "Amazon Redshift data-source connector for cognee — sync tables, queries and table comments into memory (timestamp cursor + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # Needs cognee's document-mode with table-scoped cleanup and per-row node
    # sets (DOCUMENT_SYNC_VERSION 2, cognee_node_set), present from cognee 1.6.4.
    "cognee>=1.6.4,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    # The Redshift Data API client (redshift-data).
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
# DirectConnection: a driver connection, for example through an SSH tunnel.
direct = ["redshift-connector>=2.1,<3"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_redshift"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    # Runs the direct connection against a real Postgres in tests.
    "psycopg[binary]>=3.1,<4",
]
