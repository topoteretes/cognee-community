[project]
name = "cognee-community-connector-google-drive"
version = "0.1.0"
description = "Google Drive data-source connector for cognee — sync a Drive folder into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # RELEASE-BLOCKED: the connector is self-describing via cognee "document-mode"
    # (cognee.tasks.ingestion.dlt_utils.CONTENT_COLUMN_HINT_ATTR + resolve_dlt_sources
    # routing). That is not in cognee 1.3.0 — set this pin to the first release that
    # ships document-mode before publishing. The version below is a placeholder.
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "google-api-python-client>=2.100.0,<3",
    "google-auth>=2.23.0,<3",
    "google-auth-oauthlib>=1.1.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_google_drive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Test doubles mirror the Google Drive API surface (camelCase methods and
# kwargs like getStartPageToken / fileId), so tolerate non-snake_case names.
"tests/**" = ["N802", "N803"]
