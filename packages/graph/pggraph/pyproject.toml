[project]
name = "cognee-community-graph-adapter-pggraph"
version = "0.2.1"
description = "Experimental pgGraph graph database adapter for cognee"
authors = [
    {name = "Cognee Community"},
]
readme = "README.md"
requires-python = ">=3.10,<=3.13"
dependencies = [
    "cognee==1.6.1",
    # Transitive via cognee; pinned to the version cognee 1.6.1 locks, so CI
    # resolves the litellm the upstream release was tested against. cognee 1.6.x
    # caps the range itself (>=1.83.7,<1.97.0); 1.96.2 ships abi3 wheels that
    # install on every Python this package supports.
    "litellm==1.96.2",
    "asyncpg>=0.29.0",
    "starlette>=0.48.0",
    "instructor>=1.11",
]

[project.urls]
Homepage = "https://github.com/Evokoa/pgGraph"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_graph_adapter_pggraph"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
