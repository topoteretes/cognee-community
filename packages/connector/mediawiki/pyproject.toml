[project]
name = "cognee-community-connector-mediawiki"
version = "0.1.0"
description = "MediaWiki data-source connector for cognee — sync any MediaWiki (Wikipedia, Fandom, internal wikis) into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Requires cognee's document-mode with per-row node sets and pipeline
    # scoping (dlt_utils.DOCUMENT_SYNC_VERSION >= 2), first shipped in 1.6.3.
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.9.0,<2",
    # Transport. Already a core cognee dependency; declared because it is
    # imported directly.
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "duckdb>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_mediawiki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
