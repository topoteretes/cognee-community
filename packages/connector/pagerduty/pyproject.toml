[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognee-community-connector-pagerduty"
version = "0.1.0"
description = "Cognee community connector – PagerDuty incidents and alerts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Basant Nema", email = "pianistbasant31@gmail.com" },
]
dependencies = [
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_pagerduty"]
