[project]
name = "cognee-community-connector-storyblok"
version = "0.1.0"
description = "Storyblok data-source connector for cognee: sync published stories into memory as documents (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Needs table-scoped document cleanup (DOCUMENT_SYNC_VERSION),
    # PIPELINE_SCOPE_ATTR and guarded_rows, shipped in cognee 1.6.1.
    "cognee>=1.6.3,<2",
    # cognee 1.6 imports dlt.common.time.ensure_pendulum_datetime_utc, added in 1.16.
    "dlt[sqlalchemy]>=1.16.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_storyblok"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
