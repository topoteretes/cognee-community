[project]
name = "cognee-community-hybrid-adapter-helixdb"
version = "0.1.0"
description = "HelixDB hybrid graph-vector database adapter for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "helix-py>=0.2.30",
    "cognee==1.4.2",
    # Transitive via cognee; pinned to the version cognee 1.4.2 locks (litellm
    # 1.96.x published cp310-only wheels, uninstallable on the CI's Python 3.11).
    "litellm==1.89.2",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "types-requests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "cognee.*",
  "helix.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_hybrid_adapter_helixdb"]
