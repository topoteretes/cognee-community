[project]
name = "cognee-community-connector-attio"
version = "0.1.0"
description = "Attio data-source connector for cognee — sync your CRM records and notes into memory (full snapshot + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # needs cognee "document-mode" (DOCUMENT_SOURCE_ATTR) and its orphan cleanup; tested on 1.6.x
    "cognee>=1.6.3,<2",
    # cognee pins the dlt range it supports
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_attio"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.1",
]
