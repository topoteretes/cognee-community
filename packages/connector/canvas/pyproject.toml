[project]
name = "cognee-community-connector-canvas"
version = "0.1.0"
description = "Canvas LMS data-source connector for cognee: sync courses, pages, modules, assignments, and announcements into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee>=1.6.3,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_canvas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
