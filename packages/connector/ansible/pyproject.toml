[project]
name = "cognee-community-connector-ansible"
version = "0.1.0"
description = "Ansible data-source connector for cognee — sync inventory, playbooks, roles into knowledge graph"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "pyyaml>=6.0.1",
]

[project.scripts]
cognee-ansible = "cognee_community_connector_ansible.cli:main"

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_ansible"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
