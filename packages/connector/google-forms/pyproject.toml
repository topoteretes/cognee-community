[project]
name = "cognee-community-connector-google-forms"
version = "0.1.0"
description = "Google Forms data-source connector for cognee — sync form schemas and responses into graph memory with incremental sync"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "google-api-python-client>=2.100.0,<3",
    "google-auth>=2.23.0,<3",
    "google-auth-oauthlib>=1.1.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_google_forms"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["N802", "N803"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
]
