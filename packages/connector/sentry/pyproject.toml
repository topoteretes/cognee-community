[project]
name = "cognee-community-connector-sentry"
version = "0.1.0"
description = "Sentry data-source connector for cognee — sync grouped issues, their status and a bounded stack-trace sample into memory (full re-listing + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # needs per-row node sets (DOCUMENT_SYNC_VERSION 2), table-scoped document
    # cleanup (PIPELINE_SCOPE_ATTR) and dlt_utils.guarded_rows
    "cognee>=1.6.4,<2",
    # cognee pins the dlt range it supports
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_sentry"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
]
