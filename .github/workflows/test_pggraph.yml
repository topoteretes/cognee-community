name: Test PgGraph Community Adapter

on:
  workflow_call:
    inputs:
      event-type:
        required: false
        type: string
        default: "regular-testing-event"
  workflow_dispatch:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'packages/graph/pggraph/**'

concurrency:
  group: pggraph-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test-pggraph:
    name: "PgGraph Community Adapter Test"
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognee
          POSTGRES_PASSWORD: cognee
          POSTGRES_DB: cognee
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cognee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Community Setup
        uses: ./.github/actions/community_setup
        with:
          python-version: '3.11.x'
          package-path: packages/graph/pggraph
          event-type: ${{ inputs.event-type }}

      - name: Run unit tier (offline contract tests)
        working-directory: ./packages/graph/pggraph
        run: poetry run pytest tests/unit -q

      # pgGraph itself is an optional extension; against plain postgres:16 the
      # adapter exercises its documented SQL fallback path.
      - name: Run PgGraph Tests
        env:
          ENV: 'dev'
          COGNEE_PGGRAPH_TESTS: 'true'
          GRAPH_DATABASE_HOST: 'localhost'
          GRAPH_DATABASE_PORT: '5433'
          GRAPH_DATABASE_NAME: 'cognee'
          GRAPH_DATABASE_USERNAME: 'cognee'
          GRAPH_DATABASE_PASSWORD: 'cognee'
        working-directory: ./packages/graph/pggraph
        run: poetry run pytest tests/test_pggraph.py -v
