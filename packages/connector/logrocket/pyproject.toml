[project]
name = "cognee-community-connector-logrocket"
version = "0.1.0"
description = "LogRocket session and issue document connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee>=1.6.3,<2",
    # Destination fingerprinting used by the ownership guard is verified on 1.30.
    "dlt[sqlalchemy]>=1.30,<1.31",
    "jsonschema>=4.23,<5",
    "httpx2>=2.13.1,<3",
    # LogRocket exposes sessions and issues through an MCP Streamable HTTP
    # endpoint. Use the official SDK instead of maintaining a private protocol
    # implementation in this connector.
    "mcp>=2.2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.16,<0.18",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_logrocket"]

[tool.hatch.build.targets.sdist]
include = [
    "/cognee_community_connector_logrocket",
    "/tests",
    "/examples",
    "/README.md",
    "/examples/API_INTEGRATION.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.gitignore",
]
exclude = [
    "**/__pycache__/**", "**/*.pyc", "**/.env", "**/secrets.toml", "**/*.log",
    "/CAPABILITY_FINDINGS.md", "/PROGRESS.md", "/SUPPORT_CONFIRMATION.md",
    "/PR_DESCRIPTION.md", "/examples/test-data/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
