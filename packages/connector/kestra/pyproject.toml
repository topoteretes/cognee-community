[project]
name = "cognee-community-connector-kestra"
version = "0.1.0"
description = "Kestra orchestration platform data-source connector for Cognee"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dlt>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_kestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
