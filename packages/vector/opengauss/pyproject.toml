[project]
name = "cognee-community-vector-adapter-opengauss"
version = "0.2.1"
description = "openGauss DataVec vector database adapter for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "cognee==1.5.4",
    # Transitive via cognee; pinned to the version cognee 1.5.4 locks, so CI
    # resolves the litellm the upstream release was tested against. cognee 1.5.x
    # caps the range itself (>=1.83.7,<1.97.0); 1.96.2 ships abi3 wheels that
    # install on every Python this package supports.
    "litellm==1.96.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.4.0",
    "mypy>=1.20.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_any_generics = true
strict_equality = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = [
  "psycopg2.*",
  "cognee.*",
]
ignore_missing_imports = true
