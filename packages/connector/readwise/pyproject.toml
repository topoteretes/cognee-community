[project]
name = "cognee-community-connector-readwise"
version = "0.1.0"
description = "Readwise data-source connector for cognee — sync your highlights, notes and sources into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
authors = [{ name = "cognee community" }]
keywords = ["cognee", "readwise", "connector", "highlights", "memory", "rag"]
license = { text = "Apache-2.0" }
dependencies = [
    # Requires cognee "document-mode" (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources
    # routing rows through cognify instead of the dlt-schema path), first shipped
    # in cognee 1.4.0.
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee-community/tree/main/packages/connector/readwise"
Issues = "https://github.com/topoteretes/cognee/issues/4812"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_readwise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
