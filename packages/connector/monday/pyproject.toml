[project]
name = "cognee-community-connector-monday"
version = "0.1.0"
description = "monday.com data-source connector for cognee — sync boards, items and updates into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Document-mode ingestion with merge + a _deleted hard-delete column, as used
    # by the Google Drive connector, ships in every cognee 1.4.0+. 1.6.4 is the
    # latest stable release.
    "cognee==1.6.4",
    "dlt[sqlalchemy]>=1.9.0,<1.31",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_monday"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
