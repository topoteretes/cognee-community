[project]
name = "cognee-community-graph-adapter-ladybug"
version = "0.0.1"
description = "Ladybug (Kùzu successor) graph database adapter for Cognee"
authors = [
    {name = "Cognee Community", email = "hello@cognee.ai"},
]
dependencies = [
    "cognee>=0.3.9",
    "real_ladybug>=0.0.1",
]
readme = "README.md"
requires-python = ">=3.10,<=3.13"

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
