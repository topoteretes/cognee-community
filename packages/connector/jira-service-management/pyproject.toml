[project]
name = "cognee-community-connector-jira-service-management"
version = "0.1.0"
description = "Jira Service Management Cloud request connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["cognee==1.4.0", "dlt[sqlalchemy]>=1.9,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_jira_service_management"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
