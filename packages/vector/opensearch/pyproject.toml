[project]
name = "cognee-community-vector-adapter-opensearch"
version = "0.2.0"
description = "OpenSearch vector database adapter for cognee"
readme = "README.md"
requires-python = "<=3.13,>=3.10"
dependencies = [
    "opensearch-py==3.0.0",
    "cognee==1.4.2",
    # Transitive via cognee; pinned to the version cognee 1.4.2 locks (litellm
    # 1.96.x published cp310-only wheels, uninstallable on the CI's Python 3.11).
    "litellm==1.89.2",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[project.urls]
Homepage = "https://www.cognee.ai"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/dist",
  "/.venv",
]
