[project]
name = "cognee-community-connector-azure-devops-boards"
version = "0.1.0"
description = "Azure DevOps Boards data-source connector for cognee: sync work items into memory, incremental with forget-on-delete"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Document-mode merge sources with hard-delete tombstones and table-scoped
    # orphan cleanup (DOCUMENT_SYNC_VERSION 2).
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31.0,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "duckdb>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_azure_devops_boards"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
