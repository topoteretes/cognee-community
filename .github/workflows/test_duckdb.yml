name: Test DuckDB Community Adapter

on:
  workflow_call:
    inputs:
      event-type:
        required: false
        type: string
        default: "regular-testing-event"
    secrets:
      LLM_MODEL:
        required: true
      LLM_ENDPOINT:
        required: true
      LLM_API_KEY:
        required: true
      LLM_API_VERSION:
        required: true
      EMBEDDING_MODEL:
        required: true
      EMBEDDING_ENDPOINT:
        required: true
      EMBEDDING_API_KEY:
        required: true
      EMBEDDING_API_VERSION:
        required: true
  workflow_dispatch:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'packages/hybrid/duckdb/**'

concurrency:
  group: duckdb-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test-duckdb:
    name: "DuckDB Community Adapter Test"
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Community Setup
        uses: ./.github/actions/community_setup
        with:
          python-version: '3.12.x'
          package-path: packages/hybrid/duckdb
          event-type: ${{ inputs.event-type }}

      - name: Run DuckDB Example
        env:
          ENV: 'dev'
          ENABLE_BACKEND_ACCESS_CONTROL: False
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION }}
          VECTOR_DB_PROVIDER: 'duckdb'
        working-directory: ./packages/hybrid/duckdb
        run: poetry run python examples/example.py

      - name: Run DuckDB Tests
        env:
          ENV: 'dev'
          ENABLE_BACKEND_ACCESS_CONTROL: False
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION }}
          VECTOR_DB_PROVIDER: 'duckdb'
        working-directory: ./packages/hybrid/duckdb
        run: poetry run python tests/test_duckdb.py

      - name: Run DuckDB Search Ordering Regression Test
        env:
          ENV: 'dev'
          ENABLE_BACKEND_ACCESS_CONTROL: False
        working-directory: ./packages/hybrid/duckdb
        run: poetry run python tests/test_search_ordering.py
