[project]
name = "cognee-community-connector-gong"
version = "0.1.0"
description = "Gong call transcript and deal-context connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "cognee>=1.6.2,<2",
    "dlt[sqlalchemy]>=1.9,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_gong"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
