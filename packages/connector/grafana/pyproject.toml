[project]
name = "cognee-community-connector-grafana"
version = "0.1.0"
description = "Grafana dashboard and incident annotation documents for Cognee"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["cognee>=1.6.5,<1.7", "dlt[sqlalchemy]>=1.30,<1.31", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_grafana"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
