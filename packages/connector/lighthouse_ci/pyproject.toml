[project]
name = "cognee-community-connector-lighthouse-ci"
version = "0.1.0"
description = "Lighthouse CI report data-source connector for cognee — ingest web performance, accessibility (a11y), and SEO audit results into agent memory"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee document-mode (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources routing through cognify)
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_lighthouse_ci"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
