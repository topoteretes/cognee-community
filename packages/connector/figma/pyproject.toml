[project]
name = "cognee-community-connector-figma"
version = "0.1.0"
description = "Figma data-source connector for cognee — sync design files and comment threads into memory (version-gated snapshot + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # Needs cognee's document-mode with table-scoped cleanup and per-row node
    # sets (DOCUMENT_SYNC_VERSION 2, cognee_node_set) and, for the optional
    # Figma integration in register.py, the OAuthIntegration resource-picker
    # contract and the provider-neutral run_sync, all present in cognee 1.6.4.
    "cognee>=1.6.4,<2",
    # dlt's rest_api source + RESTClient (bearer auth, Retry-After aware
    # retries) does all the Figma REST API I/O.
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_figma"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
]
