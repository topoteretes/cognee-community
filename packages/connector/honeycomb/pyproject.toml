[project]
name = "cognee-community-connector-honeycomb"
version = "0.1.0"
description = "Honeycomb observability data-source connector for Cognee"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cognee>=0.1.0",
    "dlt>=0.4.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
