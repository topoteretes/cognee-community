[project]
name = "cognee-community-vector-adapter-s3vectors"
version = "0.1.1"
description = "Amazon S3 Vectors vector database adapter for cognee"
readme = "README.md"
requires-python = "<3.14,>=3.10"
dependencies = [
    "cognee>=1.4.2,<2.0.0",
    "boto3>=1.34.0",
]

[project.urls]
Homepage = "https://www.cognee.ai"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/dist",
  "/.venv",
]

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_vector_adapter_s3vectors"]
