[project]
name = "cognee-community-connector-outlook"
version = "0.1.0"
description = "Outlook mail and calendar data-source connector for cognee — sync through Microsoft Graph delta queries (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # Requires table-scoped document cleanup (DOCUMENT_SYNC_VERSION),
    # PIPELINE_SCOPE_ATTR and guarded_rows; tested against cognee 1.6.3.
    "cognee>=1.6.3,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "msal>=1.28.0,<2",
    # Windows zone names to IANA, for the day of an all-day event.
    "tzlocal>=4,<6",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_outlook"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "responses>=0.25,<1",
]
