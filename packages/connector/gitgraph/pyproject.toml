[project]
name = "cognee-community-connector-gitgraph"
version = "0.1.0"
description = "Git history, Python AST symbols and CI failures as Cognee documents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "cognee>=1.6.5,<2",
  "dlt[sqlalchemy]>=1.16,<2",
  "GitPython>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_gitgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: runs real cognee with its local embedded stores"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
