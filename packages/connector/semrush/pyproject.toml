[project]
name = "cognee-community-connector-semrush"
version = "0.1.0"
description = "Semrush data-source connector for cognee — sync domain ranks and organic keywords into memory (replace snapshot + historical cursor)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Requires cognee>=1.6.3 for PIPELINE_SCOPE_ATTR, dlt[sqlalchemy]>=1.16.0, and requests.
    "cognee>=1.6.3",
    "dlt[sqlalchemy]>=1.16.0,<2",
    "requests>=2.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<2",
    "duckdb>=1.0.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_semrush"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
