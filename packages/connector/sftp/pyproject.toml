[project]
name = "cognee-community-connector-sftp"
version = "0.1.0"
description = "SFTP data-source connector for cognee: sync text files and PDFs from an SFTP server into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Needs document-mode routing (DOCUMENT_SOURCE_ATTR), the table-scoped
    # orphan cleanup, PIPELINE_SCOPE_ATTR and guarded_rows, in cognee 1.6.3
    # and later 1.x releases.
    "cognee>=1.6.3,<2",
    # cognee 1.6 imports dlt.common.time.ensure_pendulum_datetime_utc, added in 1.16.
    "dlt[sqlalchemy]>=1.16.0,<2",
    # 3.5.1 is the first that reads encrypted PEM keys with current cryptography;
    # PKey.from_path and the host key APIs used here are unchanged up to 5.x.
    "paramiko>=3.5.1,<6",
    # Reads the text of PDFs; the range cognee itself requires.
    "pypdf>=6.6.2,<7",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_sftp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
