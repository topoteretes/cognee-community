version: "3.8"

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: production-web-frontend
    ports:
      - "80:3000"
      - "443:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge-network
      - internal-network

  backend:
    image: company/api-server:v2.4.0
    container_name: production-backend-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://admin:secret@postgres:5432/app_prod
      REDIS_URL: redis://redis:6379/0
      PORT: 8080
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal-network

  postgres:
    image: postgres:16-alpine
    container_name: production-db-primary
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app_prod
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always
    networks:
      - internal-network

  redis:
    image: redis:7.2-alpine
    container_name: production-cache
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - internal-network

volumes:
  postgres_data:

networks:
  edge-network:
    driver: bridge
  internal-network:
    driver: bridge
