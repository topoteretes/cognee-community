[project]
name = "cognee-community-connector-bigquery"
version = "0.1.0"
description = "BigQuery data-source connector for cognee — sync BigQuery table schemas, descriptions, and query results into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.14"
dependencies = [
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "google-cloud-bigquery>=3.20.0,<4",
    "google-auth>=2.23.0,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_bigquery"]

[tool.pytest.ini_options]
norecursedirs = [".*", ".venv", "build", "dist"]
addopts = "-p no:typeguard"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["N802", "N803"]
