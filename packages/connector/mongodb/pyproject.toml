[project]
name = "cognee-community-connector-mongodb"
version = "0.1.0"
description = "MongoDB data-source connector for cognee — sync a collection into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "pymongo>=4.6.0,<5",
]

[dependency-groups]
# Declared so the forget-on-delete proof actually runs. The sibling connectors
# leave these undeclared, which makes their equivalent end-to-end tests skip
# silently wherever the extras happen to be missing.
dev = [
    "pytest>=8,<9",
    "mongomock>=4.1,<5",
    "duckdb>=1,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_mongodb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
