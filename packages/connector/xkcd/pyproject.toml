[project]
name = "cognee-community-connector-xkcd"
version = "0.1.0"
description = "xkcd data-source connector for cognee — sync xkcd comics into memory (incremental watermark sync, no auth)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee "document-mode" (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources
    # routing rows through cognify instead of the dlt-schema path), first shipped
    # in cognee 1.4.0.
    "cognee==1.6.2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_xkcd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
