[project]
name = "cognee-community-connector-brex"
version = "0.1.0"
description = "Brex data-source connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_brex"]

[tool.ruff]
line-length = 100
target-version = "py311"
