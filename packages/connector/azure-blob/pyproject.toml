[project]
name = "cognee-community-connector-azure-blob"
version = "0.1.0"
description = "Azure Blob Storage data-source connector for cognee — sync documents into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Match GCS PR #452: includes final-document graph/vector cleanup fixes.
    "cognee==1.6.5",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "azure-core>=1.31,<2",
    "azure-storage-blob>=12.25.1,<13",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"
Issues = "https://github.com/topoteretes/cognee/issues/4762"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_azure_blob"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# Use the same import roots as the repository-wide Ruff configuration.
src = ["../../.."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
