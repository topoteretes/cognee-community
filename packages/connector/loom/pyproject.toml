[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognee-community-connector-loom"
version = "0.1.0"
description = "Loom async video & transcript data-source connector for cognee (Mergetober)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cognee",
    "dlt[duckdb]>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
