[project]
name = "cognee-community-graph-adapter-turingdb"
version = "0.1.1"
description = "Turingdb graph database adapter for cognee"
readme = "README.md"
requires-python =  ">=3.11,<=3.13"
dependencies = [
    "turingdb>=1.22.0",
    "cognee==1.4.1",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_graph_adapter_turingdb"]
