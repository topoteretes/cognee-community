[project]
name = "cognee-community-connector-crates"
version = "0.1.0"
description = "Crates.io Rust package registry connector for Cognee — index Rust crates, dependencies, feature flags, and docs into AI memory"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[project.scripts]
cognee-crates = "cognee_community_connector_crates.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_crates"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
