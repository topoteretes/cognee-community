[project]
name = "cognee-community-connector-fibery"
version = "0.1.0"
description = "Selected Fibery databases as Cognee documents, with incremental sync and deletion tombstones"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "cognee>=1.6.3,<2",
  "dlt[sqlalchemy]>=1.16,<2",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_fibery"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
