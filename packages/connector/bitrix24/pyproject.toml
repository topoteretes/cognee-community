[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "cognee-community-connector-bitrix24"
version = "0.1.0"
description = "Bitrix24 CRM community connector for Cognee"
authors = ["Bhomvrat Rai <bhomvratrai@gmail.com>"]
readme = "README.md"
packages = [{include = "cognee_community_connector_bitrix24"}]

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
aioresponses = "^0.7.6"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
