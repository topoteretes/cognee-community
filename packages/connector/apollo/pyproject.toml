[project]
name = "cognee-community-connector-apollo"
version = "0.1.0"
description = "Apollo.io data-source connector for cognee — sync your CRM contacts, accounts and sequence activity into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # needs table-scoped dlt document cleanup (PIPELINE_SCOPE_ATTR), first shipped in cognee 1.6.1
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.9.0,<1.31",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_apollo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
