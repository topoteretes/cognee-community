[project]
name = "cognee-community-connector-evernote"
version = "0.1.0"
description = "Evernote data-source connector for cognee — sync your Evernote notes into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee "document-mode" (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources
    # routing notes through cognify instead of the dlt-schema path), first shipped
    # in cognee 1.4.0.
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    # Evernote's EDAM Thrift service. Only the generated `evernote.edam.*` stubs +
    # its vendored pure-python `thrift` runtime are used — the SDK's own
    # `evernote.api.client` is NOT importable (it imports the unmaintained `oauth2`
    # package), so OAuth 1.0a is implemented here on requests-oauthlib instead.
    "evernote3==1.25.14",
    "requests-oauthlib>=1.3.1,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_evernote"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<2",
    "duckdb>=1.1,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# The fake Thrift client in the tests mirrors EDAM's generated accessors, whose
# field/method names are camelCase (expungedNotes, tagNames, chunkHighUSN, ...).
"tests/**" = ["N802", "N803"]
