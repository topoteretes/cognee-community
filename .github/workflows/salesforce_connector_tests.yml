name: Salesforce connector
on:
  pull_request:
    branches: [main]
    paths: ['packages/connector/salesforce/**', '.github/workflows/salesforce_connector_tests.yml']
  push:
    branches: [main]
    paths: ['packages/connector/salesforce/**', '.github/workflows/salesforce_connector_tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    # the whole suite runs against an httpx.MockTransport fake: no Salesforce org,
    # no network and no LLM key
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: packages/connector/salesforce
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.3
      - run: uv sync --locked --group dev
      - run: uv run --frozen pytest tests -ra
      - name: Test the lowest supported cognee
        # pyproject asks for cognee>=1.6.4 (per-row node sets); this is that floor
        if: matrix.python == '3.11'
        run: uv run --frozen --with 'cognee==1.6.4' python -m pytest tests -ra
      - run: uv build
      - name: Install the wheel outside the checkout
        run: |
          uv venv /tmp/salesforce-wheel
          uv pip install --python /tmp/salesforce-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/salesforce-wheel/bin/python -c 'import cognee_community_connector_salesforce'
