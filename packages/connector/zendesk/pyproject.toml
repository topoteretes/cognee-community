[project]
name = "cognee-community-connector-zendesk"
version = "0.1.0"
description = "Zendesk data-source connector for cognee — sync tickets (with comments) and Help Center articles into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # 1.6.x: cognee 1.4 skips orphan cleanup when a table's last row is deleted, so the final
    # deleted record was never forgotten; 1.6 handles the empty table (verified end to end).
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_zendesk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
