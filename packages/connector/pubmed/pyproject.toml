[project]
name = "cognee-community-connector-pubmed"
version = "0.1.0"
description = "PubMed data-source connector for cognee — sync article metadata and abstracts into memory with incremental edat sync and forget-on-delete"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_pubmed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
