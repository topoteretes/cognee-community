[project]
name = "cognee-community-connector-postman"
version = "0.1.0"
description = "Incremental Postman request documents for Cognee"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["cognee>=1.6.3,<2", "dlt[sqlalchemy]>=1.29,<1.31", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_postman"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
