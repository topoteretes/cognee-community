[project]
name = "cognee-community-connector-obsidian"
version = "0.1.0"
description = "Obsidian vault data-source connector for cognee — sync your vault into memory (incremental sync + wikilink edges + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Requires cognee's document-mode with table-scoped cleanup, pipeline
    # scoping and guarded extraction (dlt_utils.DOCUMENT_SYNC_VERSION >= 1,
    # PIPELINE_SCOPE_ATTR, guarded_rows), all present from 1.6.3.
    "cognee>=1.6.3,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_obsidian"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
