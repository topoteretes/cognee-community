[project]
name = "cognee-community-connector-s3"
version = "0.1.0"
description = "AWS S3 data-source connector for cognee with bounded incremental reconciliation"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
  "cognee>=1.6.1,<2",
  "dlt[sqlalchemy]>=1.9.0,<2",
  "boto3>=1.34,<2",
]

[dependency-groups]
dev = ["pytest>=8", "moto[s3]>=5,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_s3"]
