[project]
name = "cognee-community-connector-calendly"
version = "0.1.0"
description = "Calendly data-source connector for cognee — sync your scheduled events, invitee Q&A, and notes into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee "document-mode" (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources
    # routing rows through cognify instead of the dlt-schema path), first shipped
    # in cognee 1.4.0 — same requirement as the notion/google-drive connectors.
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0",
    "duckdb>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"
Issue = "https://github.com/topoteretes/cognee/issues/4816"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_calendly"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
