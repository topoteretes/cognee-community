[project]
name = "cognee-community-vector-adapter-clickhouse"
version = "0.1.0"
description = "ClickHouse vector database adapter for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "clickhouse-connect>=0.8.0",
    "cognee>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.4.0",
    "mypy>=1.10,<2",
]

[tool.poetry]
name = "cognee-community-vector-adapter-clickhouse"
version = "0.1.0"
description = "ClickHouse vector database adapter for cognee"
authors = ["Cognee Community <support@cognee.ai>"]
readme = "README.md"
packages = [{ include = "cognee_community_vector_adapter_clickhouse" }]

[tool.poetry.dependencies]
python = ">=3.11,<=3.13"
clickhouse-connect = ">=0.8.0"
cognee = ">=1.1.0,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=1.4.0"
mypy = ">=1.10,<2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/dist",
  "/.venv",
]

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_vector_adapter_clickhouse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_any_generics = true
strict_equality = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = [
  "clickhouse_connect.*",
  "cognee.*",
]
ignore_missing_imports = true
