[project]
name = "cognee-community-connector-mixpanel"
version = "0.1.0"
description = "Sync Mixpanel report, cohort and event-schema definitions into cognee"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee>=1.6.5,<1.7",
    "dlt[sqlalchemy]>=1.30,<1.31",
    # App API envelopes and the internal API-client adapter are version-specific.
    "mixpanel-headless==0.4.0",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_mixpanel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: uses the installed cognee and local databases"]
