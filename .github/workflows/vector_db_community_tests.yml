name: Community Vector DB Tests

on:
  workflow_call:
    inputs:
      databases:
        required: false
        type: string
        default: "all"
        description: "Which vector databases to test (comma-separated list or 'all')"
      python-version:
        required: false
        type: string
        default: "3.11.x"
      event-type:
        required: false
        type: string
        default: "regular-testing-event"
    secrets:
      LLM_MODEL:
        required: true
      LLM_ENDPOINT:
        required: true
      LLM_API_KEY:
        required: true
      LLM_API_VERSION:
        required: true
      EMBEDDING_MODEL:
        required: true
      EMBEDDING_ENDPOINT:
        required: true
      EMBEDDING_API_KEY:
        required: true
      EMBEDDING_API_VERSION:
        required: true
      QDRANT_API_URL:
        required: false
      QDRANT_API_KEY:
        required: false
      WEAVIATE_API_URL:
        required: false
      WEAVIATE_API_KEY:
        required: false

jobs:
  test-qdrant:
    name: "Qdrant Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'qdrant') }}
    with:
      event-type: ${{ inputs.event-type }}
    uses: ./.github/workflows/test_qdrant.yml
    secrets: inherit

  test-weaviate:
    name: "Weaviate Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'weaviate') }}
    with:
      event-type: ${{ inputs.event-type }}
    uses: ./.github/workflows/test_weaviate.yml
    secrets: inherit

  test-opensearch:
    name: "OpenSearch Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'opensearch') }}
    with:
      event-type: ${{ inputs.event-type }}
    uses: ./.github/workflows/test_opensearch.yml
    secrets: inherit

  test-redis:
    name: "Redis Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'redis') }}
    with:
      event-type: ${{ inputs.event-type }}
    uses: ./.github/workflows/test_redis.yml
    secrets: inherit

  test-singlestore:
    name: "SingleStore Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'singlestore') }}
    with:
      event-type: ${{ inputs.event-type }}
    uses: ./.github/workflows/test_singlestore.yml
    secrets: inherit

  test-clickhouse:
    name: "ClickHouse Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'clickhouse') }}
    with:
      event-type: ${{ inputs.event-type }}
    uses: ./.github/workflows/test_clickhouse.yml
    secrets: inherit

  test-valkey:
    name: "Valkey Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'valkey') }}
    uses: ./.github/workflows/test_valkey.yml
    secrets: inherit

  test-milvus:
    name: "Milvus Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'milvus') }}
    with:
      event-type: ${{ inputs.event-type }}
    uses: ./.github/workflows/test_milvus.yml
    secrets: inherit

  test-duckdb:
    name: "DuckDB Community Adapter Test"
    if: ${{ inputs.databases == 'all' || contains(inputs.databases, 'duckdb') }}
    with:
      event-type: ${{ inputs.event-type }}
    uses: ./.github/workflows/test_duckdb.yml
    secrets: inherit
