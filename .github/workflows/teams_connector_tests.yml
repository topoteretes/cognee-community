name: Teams connector
on:
  pull_request:
    branches: [main]
    paths: ['packages/connector/teams/**', '.github/workflows/teams_connector_tests.yml']
  push:
    branches: [main]
    paths: ['packages/connector/teams/**', '.github/workflows/teams_connector_tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: packages/connector/teams
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.3
      - run: uv sync --locked --group dev
      - run: uv run --frozen pytest tests -ra
      - name: Test Cognee 1.6.6 compatibility
        if: matrix.python == '3.11'
        run: uv run --frozen --with 'cognee==1.6.6' python -m pytest tests -ra
      - run: uvx ruff@0.13.3 check .
      - run: uvx ruff@0.13.3 format --check .
      - run: uv build
      - name: Install wheel outside checkout
        run: |
          uv venv /tmp/teams-wheel
          uv pip install --python /tmp/teams-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/teams-wheel/bin/python -c 'import cognee_community_connector_teams'
