[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognee-community-connector-appflowy"
version = "0.1.0"
description = "Cognee community data-source connector for AppFlowy knowledge bases, workspaces, and databases"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cognee",
    "dlt",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_appflowy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "RUF"]
