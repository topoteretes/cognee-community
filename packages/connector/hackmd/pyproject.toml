[project]
name = "cognee-community-connector-hackmd"
version = "0.1.0"
description = "HackMD data-source connector for cognee: sync personal and team notes into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Needs document-mode routing (DOCUMENT_SOURCE_ATTR), the table-scoped
    # orphan cleanup, PIPELINE_SCOPE_ATTR and guarded_rows, in cognee 1.6.3
    # and later 1.x releases.
    "cognee>=1.6.3,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_hackmd"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
