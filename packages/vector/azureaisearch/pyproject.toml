[project]
name = "cognee-community-vector-adapter-azure"
version = "0.1.1"
description = "Azure AI search vector database adapter for cognee"
readme = "README.md"
requires-python = "<=3.13,>=3.10"
dependencies = [
    "azure-search-documents>=11.4.0",
    "azure-core>=1.29.0",
    "cognee==1.5.4",
    # Transitive via cognee; pinned to the version cognee 1.5.4 locks, so CI
    # resolves the litellm the upstream release was tested against. cognee 1.5.x
    # caps the range itself (>=1.83.7,<1.97.0); 1.96.2 ships abi3 wheels that
    # install on every Python this package supports.
    "litellm==1.96.2",
]

[project.urls]
Homepage = "https://www.cognee.ai"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/dist",
  "/.venv",
]
