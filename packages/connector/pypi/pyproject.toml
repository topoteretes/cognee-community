[project]
name = "cognee-community-connector-pypi"
version = "0.1.0"
description = "PyPI exact-release metadata connector for cognee — ingest package release descriptions, dependencies, and metadata into memory"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27.0,<1",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_pypi"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
