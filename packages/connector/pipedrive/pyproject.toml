[project]
name = "cognee-community-connector-pipedrive"
version = "0.1.0"
description = "Pipedrive data-source connector for cognee — sync your CRM deals, people, organizations, activities and notes into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # needs table-scoped dlt document cleanup (PIPELINE_SCOPE_ATTR) and dlt_utils.guarded_rows
    "cognee>=1.6.3,<2",
    # cognee pins the dlt range it supports
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_pipedrive"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
