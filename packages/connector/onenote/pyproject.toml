[project]
name = "cognee-community-connector-onenote"
version = "0.1.0"
description = "Selected OneNote notebooks as incrementally fetched Cognee documents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cognee==1.6.3",
  "dlt[sqlalchemy]==1.30.0",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "msal>=1.39,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_onenote"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
