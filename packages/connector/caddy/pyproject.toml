[project]
name = "cognee-community-connector-caddy"
version = "0.1.0"
description = "Caddy Web Server (Caddyfile) reverse proxy & routing data-source connector for cognee — ingest site blocks, upstreams, and matchers into agent memory"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_caddy"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
