name: Twitch connector
on:
  pull_request:
    branches: [main]
    paths: ['packages/connector/twitch/**', '.github/workflows/twitch_connector_tests.yml']
  push:
    branches: [main]
    paths: ['packages/connector/twitch/**', '.github/workflows/twitch_connector_tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: packages/connector/twitch
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.3
      - run: uv sync --group dev
      - run: uv run pytest tests -ra
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build
