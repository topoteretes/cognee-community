[project]
name = "cognee-community-connector-bigquery"
version = "0.1.0"
description = "BigQuery data-source connector for cognee — table and column metadata (plus opt-in rows) as memory, incremental with forget-on-delete"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Document mode (DOCUMENT_SOURCE_ATTR) shipped in cognee 1.4.0; 1.6.x adds
    # PIPELINE_SCOPE_ATTR, which keeps this source's dlt state (cursor, known ids)
    # separate from other sources and datasets instead of one shared pipeline.
    "cognee==1.6.2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "google-cloud-bigquery>=3.20.0,<4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_bigquery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
