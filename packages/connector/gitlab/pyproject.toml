[project]
name = "cognee-community-connector-gitlab"
version = "0.1.0"
description = "GitLab data-source connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "cognee>=1.6.2,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.urls]
Repository = "https://github.com/topoteretes/cognee-community"
Issue = "https://github.com/topoteretes/cognee/issues/4709"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_gitlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
