[project]
name = "cognee-community-connector-snowflake"
version = "0.1.0"
description = "Snowflake data-source connector for cognee: sync tables and their comments into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    # Needs table-scoped dlt document cleanup (DOCUMENT_SYNC_VERSION 2),
    # PIPELINE_SCOPE_ATTR and dlt_utils.guarded_rows, all in cognee 1.6.3.
    "cognee>=1.6.3,<2",
    # cognee pins the dlt range it supports.
    "dlt[sqlalchemy]>=1.9.0,<2",
    # Snowflake's own driver, for key-pair login and the Snowflake-only queries
    # (CHANGES, SYSTEM$LAST_CHANGE_COMMIT_TIME). Below 5: 5.0 is a fresh rewrite
    # (October 2026) that is four times larger and warns on every connect.
    "snowflake-connector-python>=3.12,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_snowflake"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
