[project]
name = "cognee-community-connector-s3"
version = "0.1.0"
description = "Bounded S3 document snapshots for Cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = ["cognee==1.4.0", "dlt[sqlalchemy]>=1.9.0,<2", "boto3>=1.34,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_s3"]
