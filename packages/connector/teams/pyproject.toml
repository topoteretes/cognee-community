[project]
name = "cognee-community-connector-teams"
version = "0.1.0"
description = "Microsoft Teams data-source connector for cognee — sync channel threads into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Needs document-mode (DOCUMENT_SOURCE_ATTR), table-scoped document cleanup
    # (DOCUMENT_SYNC_VERSION) and PIPELINE_SCOPE_ATTR, all in cognee 1.6.x.
    "cognee==1.6.4",
    # dlt's rest_api source + RESTClient (OAuth2 client credentials, JSON link
    # paging, Retry-After aware retries) does all the Microsoft Graph I/O.
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_teams"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
