[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "cognee-community-connector-gitee"
version = "0.1.0"
description = "Gitee repositories, issues, pull requests, commits, and releases data-source connector for Cognee"
authors = ["Rizul Chauhan <227848501+RizulChauhan@users.noreply.github.com>"]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/topoteretes/cognee-community"
keywords = ["cognee", "gitee", "git", "issues", "pull-requests", "code-intelligence", "connector"]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
