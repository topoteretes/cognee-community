[project]
name = "cognee-community-connector-miro"
version = "0.1.0"
description = "Miro data-source connector for cognee — frame-aware full-snapshot board sync"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Requires scoped document cleanup for a successful empty replacement,
    # which lets deleting the final board/frame remove its cognee data.
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_miro"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
