name: Vercel connector
on:
  pull_request:
    branches: [main]
    paths: ['packages/connector/vercel/**', '.github/workflows/vercel_connector_tests.yml']
  push:
    branches: [main]
    paths: ['packages/connector/vercel/**', '.github/workflows/vercel_connector_tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME__DLTHUB_TELEMETRY: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          # From uv.lock (cognee 1.6.5, dlt 1.30.0), oldest and newest Python.
          - {python: '3.10', deps: lock}
          - {python: '3.14', deps: lock}
          # The floor in pyproject.toml: cognee 1.6.1 and dlt 1.9.0.
          - {python: '3.12', deps: floor}
    defaults:
      run:
        working-directory: packages/connector/vercel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.3
      - name: Install from uv.lock
        if: matrix.deps == 'lock'
        run: uv sync --locked
      - name: Install the oldest supported versions
        if: matrix.deps == 'floor'
        # dlt 1.9.0 still imports pkg_resources: setuptools 81 warns about it and
        # 82 removed it.
        run: |
          uv venv
          uv pip install -e . 'cognee==1.6.1' 'dlt[sqlalchemy]==1.9.0' 'setuptools<81'
      - run: uv run --no-sync --with pytest pytest tests -ra
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uv build
      - name: Install wheel outside checkout
        run: |
          uv venv /tmp/vercel-wheel
          uv pip install --python /tmp/vercel-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/vercel-wheel/bin/python -c 'import cognee_community_connector_vercel'
