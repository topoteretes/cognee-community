[project]
name = "cognee-community-connector-datahub"
version = "0.1.0"
description = "DataHub data-source connector for cognee: sync dataset metadata, ownership, glossary and lineage into memory (full snapshot + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Needs document-mode routing (DOCUMENT_SOURCE_ATTR), table-scoped orphan
    # cleanup (DOCUMENT_SYNC_VERSION), PIPELINE_SCOPE_ATTR and guarded_rows.
    "cognee>=1.6.2,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31.0,<3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_datahub"]

[tool.pytest.ini_options]
markers = ["live: needs a running DataHub (DATAHUB_LIVE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
