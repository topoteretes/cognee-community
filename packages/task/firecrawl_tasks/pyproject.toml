[project]
name = "cognee-community-tasks-firecrawl"
version = "0.1.0"
description = "Package containing custom cognee tasks for scraping and searching the web using Firecrawl"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.6.1",
    "firecrawl-py>=4.45.0,<5",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
