[project]
name = "cognee-community-connector-rollbar"
version = "0.1.0"
description = "Rollbar data-source connector for cognee — sync a project's error items, their resolution state and a stack-trace excerpt into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # reads the per-row cognee_node_set column (DOCUMENT_SYNC_VERSION 2), first shipped in cognee 1.6.4
    "cognee==1.6.4",
    "dlt[sqlalchemy]>=1.9.0,<1.31",
    "httpx>=0.27.0,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_rollbar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
