[project]
name = "cognee-community-connector-s3"
version = "0.1.0"
description = "AWS S3 data-source connector for cognee with bounded incremental reconciliation"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
  "cognee>=1.6.1,<2",
  "dlt[sqlalchemy]>=1.9.0,<2",
  "boto3>=1.34,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "moto[s3]>=5,<6",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_s3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]