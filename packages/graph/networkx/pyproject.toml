[project]
name = "cognee-community-graph-adapter-networkx"
version = "1.1.1"
description = "Networkx graph database adapter for cognee"
readme = "README.md"
requires-python =  ">=3.11,<=3.13"
dependencies = [
    "networkx>=3.4.2,<4",
    "cognee==1.5.4",
    # Transitive via cognee; pinned to the version cognee 1.5.4 locks, so CI
    # resolves the litellm the upstream release was tested against. cognee 1.5.x
    # caps the range itself (>=1.83.7,<1.97.0); 1.96.2 ships abi3 wheels that
    # install on every Python this package supports.
    "litellm==1.96.2",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_graph_adapter_networkx"]
