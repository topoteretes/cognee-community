[project]
name = "cognee-community-connector-openalex"
version = "0.1.0"
description = "OpenAlex Works connector for Cognee"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "cognee>=1.6.0,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_openalex"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]
