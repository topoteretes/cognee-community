[project]
name = "cognee-community-connector-contentful"
version = "0.1.0"
description = "Contentful data-source connector for Cognee with incremental sync and deletion reconciliation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee>=1.6.3,<1.7",
    "dlt[sqlalchemy]>=1.30,<1.31",
    "httpx>=0.28,<0.29",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"
Issues = "https://github.com/topoteretes/cognee/issues/4787"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_contentful"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
