[project]
name = "cognee-community-connector-basecamp"
version = "0.1.0"
description = "Basecamp data-source connector for cognee: sync messages, to-dos, documents and comments into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Needs cognee document mode (DOCUMENT_SOURCE_ATTR) and the per-row node-set
    # column (NODE_SET_COLUMN, DOCUMENT_SYNC_VERSION 2), released in cognee 1.6.3.
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_basecamp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
