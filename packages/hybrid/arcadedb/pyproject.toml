[project]
name = "cognee-community-hybrid-adapter-arcadedb"
version = "0.5.0"
description = "ArcadeDB hybrid database adapter for Cognee (graph + vector)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "cognee==1.4.2",
    # Transitive via cognee; pinned to the version cognee 1.4.2 locks (litellm
    # 1.96.x published cp310-only wheels, uninstallable on the CI's Python 3.11).
    "litellm==1.89.2",
    "starlette>=0.48.0",
    "instructor>=1.11",
]

[project.optional-dependencies]
bolt = [
    "neo4j>=5.0.0,<6.0.0",
]
dev = [
    "mypy>=1.0.0",
    "types-requests",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "cognee.*",
  "neo4j.*",
  "aiohttp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_hybrid_adapter_arcadedb"]
