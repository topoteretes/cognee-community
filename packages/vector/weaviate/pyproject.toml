[project]
name = "cognee-community-vector-adapter-weaviate"
version = "0.2.1"
description = "Weaviate vector database adapter for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "weaviate-client>=4.9.6,<5.0.0",
    "cognee==1.5.4",
    # Transitive via cognee; pinned to the version cognee 1.5.4 locks, so CI
    # resolves the litellm the upstream release was tested against. cognee 1.5.x
    # caps the range itself (>=1.83.7,<1.97.0); 1.96.2 ships abi3 wheels that
    # install on every Python this package supports.
    "litellm==1.96.2",
    "starlette>=0.48.0",
    "instructor>=1.11"
] 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_vector_adapter_weaviate"]
