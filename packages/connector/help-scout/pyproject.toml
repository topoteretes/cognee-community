[project]
name = "cognee-community-connector-help-scout"
version = "0.1.0"
description = "Help Scout data-source connector for cognee — sync conversations, threads and Docs articles into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # cognee >= 1.6.1 ships PIPELINE_SCOPE_ATTR, guarded_rows and
    # DOCUMENT_SYNC_VERSION (table-scoped document cleanup), which this
    # connector relies on; it refuses to run on older cores.
    "cognee>=1.6.1,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-timeout>=2.3.1", "ruff>=0.9.0"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_help_scout"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
timeout = 60
