[project]
name = "cognee-community-connector-read-ai"
version = "0.1.0"
description = "Read.ai meeting documents for Cognee with OAuth and verified scoped synchronization"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.6.4",
    "dlt[sqlalchemy]>=1.30,<1.31",
    "httpx>=0.28,<1",
    "filelock>=3.18,<4",
    "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
read-ai-connect = "cognee_community_connector_read_ai.cli:main"

[project.urls]
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_read_ai"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
