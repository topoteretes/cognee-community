[project]
name = "cognee-community-vector-adapter-milvus"
version = "0.1.2"
description = "Milvus vector database adapter for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "pymilvus>=2.5.0,<3",
    "milvus-lite>=2.4.0; sys_platform != 'win32'",
    "cognee==1.4.1",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
#disallow_untyped_defs = true
check_untyped_defs = true
disallow_any_generics = true
strict_equality = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = [
  "pymilvus.*",
  "cognee.*",
  # Shared test helpers imported via a sys.path shim in tests/conftest.py
  # (packages/shared/contract_suite) — invisible to mypy's import resolution.
  "contract_suite.*",
  "contract_suite",
]
ignore_missing_imports = true
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_vector_adapter_milvus"]
