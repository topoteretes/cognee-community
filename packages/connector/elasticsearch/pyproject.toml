[project]
name = "cognee-community-connector-elasticsearch"
version = "0.1.0"
description = "Incremental Elasticsearch document sync with forget-on-delete for Cognee"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.28,<1.31",
    "elasticsearch>=8.17,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "hypothesis>=6,<7", "pytest-cov>=6,<8"]

[project.urls]
Repository = "https://github.com/topoteretes/cognee-community"
Issues = "https://github.com/topoteretes/cognee/issues/4770"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_elasticsearch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: requires a disposable Elasticsearch server", "cognee: exercises real Cognee stores"]
