[project]
name = "cognee-community-connector-supabase"
version = "0.1.0"
description = "Read-only, incremental Supabase PostgreSQL connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee==1.4.2",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "psycopg[binary]>=3.1,<4",
    "requests>=2.31,<3",
    "sqlalchemy>=2,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_supabase"]

[tool.pytest.ini_options]
markers = ["integration: requires a live Supabase project"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
