[project]
name = "cognee-community-connector-figma"
version = "0.1.0"
description = "Figma data-source connector for cognee — sync design files and comment threads into memory (version-gated snapshot + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Needs cognee's "document-mode" (DOCUMENT_SOURCE_ATTR, cognee 1.4.0+) and,
    # for the optional OAuth integration in register.py, the OAuthIntegration
    # resource-picker contract (resource_selection_key/list_resources/sync_now),
    # first shipped in cognee 1.6.2.
    "cognee==1.6.3",
    # dlt's rest_api source + RESTClient (bearer auth, Retry-After aware
    # retries) does all the Figma REST API I/O.
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_figma"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
