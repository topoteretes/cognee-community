[project]
name = "cognee-community-connector-calendly"
version = "0.1.0"
description = "Calendly data-source connector for cognee — sync your scheduled events (invitee Q&A + notes) into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee "document-mode" (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources
    # routing events through cognify instead of the dlt-schema path), first shipped
    # in cognee 1.4.0.
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.27,<1",
    # cognee 1.4.0 pulls in lancedb>=0.24.3; the newest satisfying release (0.38.0)
    # dropped win_amd64 wheels, which breaks `uv sync` on Windows. Pin the last
    # version that ships a Windows wheel (0.34.0) — the same version the notion and
    # google-drive connectors resolve to in their uv.lock.
    "lancedb==0.34.0",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_calendly"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
