[project]
name = "cognee-community-connector-whatsapp"
version = "0.1.0"
description = "WhatsApp chat export connector for cognee: turn exported chats into memory (incremental + window-aware forget)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Needs document-mode routing (DOCUMENT_SOURCE_ATTR), the table-scoped
    # orphan cleanup marked by DOCUMENT_SYNC_VERSION, PIPELINE_SCOPE_ATTR and
    # guarded_rows, all in cognee 1.6.2 and later 1.x releases.
    "cognee>=1.6.2,<2",
    "dlt[sqlalchemy]>=1.9.0,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23,<2", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_whatsapp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
