[project]
name = "cognee-community-connector-firestore"
version = "0.1.0"
description = "Google Cloud Firestore connector for Cognee"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "google-cloud-firestore>=2.16.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_firestore"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]