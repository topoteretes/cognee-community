[project]
name = "cognee-community-connector-packagist"
version = "0.1.0"
description = "Packagist / Composer (PHP Package Registry) data-source connector for cognee — sync package releases, dependencies, abandonment notices, and security advisories into AI memory"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[project.scripts]
cognee-packagist = "cognee_community_connector_packagist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_packagist"]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
