name: Clay connector
on:
  pull_request:
    branches: [main]
    paths: ['packages/connector/clay/**', '.github/workflows/clay_connector_tests.yml']
  push:
    branches: [main]
    paths: ['packages/connector/clay/**', '.github/workflows/clay_connector_tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: packages/connector/clay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --with pytest pytest tests -ra
      - run: uv run --with ruff ruff check .
      - run: uv run --with ruff ruff format --check .
      - run: uv build
      - name: Install wheel outside checkout
        run: |
          uv venv /tmp/clay-wheel
          uv pip install --python /tmp/clay-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/clay-wheel/bin/python -c 'import cognee_community_connector_clay'
