[project]
name = "cognee-community-connector-gdelt"
version = "0.1.0"
description = "GDELT DOC 2.0 global news metadata connector for cognee — sync worldwide news events, source domains, and multilingual coverage into agent semantic memory"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee document-mode (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources routing through cognify)
    "cognee>=1.4.0",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.28.0,<3",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_gdelt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
