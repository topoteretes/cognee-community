[project]
name = "cognee-community-connector-gitlab"
version = "0.1.0"
description = "GitLab data-source connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cognee==1.6.5",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "httpx>=0.28.1,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"
Issues = "https://github.com/topoteretes/cognee/issues/4709"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_gitlab"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# Use the same import roots as the repository-wide Ruff configuration.
src = ["../../.."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
