name: Test Milvus Community Adapter

on:
  workflow_call:
    inputs:
      event-type:
        required: false
        type: string
        default: "regular-testing-event"
    secrets:
      LLM_MODEL:
        required: true
      LLM_ENDPOINT:
        required: true
      LLM_API_KEY:
        required: true
      LLM_API_VERSION:
        required: true
      EMBEDDING_MODEL:
        required: true
      EMBEDDING_ENDPOINT:
        required: true
      EMBEDDING_API_KEY:
        required: true
      EMBEDDING_API_VERSION:
        required: true
  workflow_dispatch:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'packages/vector/milvus/**'

concurrency:
  group: milvus-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test-milvus:
    name: "Milvus Community Adapter Test"
    runs-on: ubuntu-22.04
    # A hung Milvus bootstrap once idled for hours; fail fast instead.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Community Setup
        uses: ./.github/actions/community_setup
        with:
          python-version: '3.11.x'
          package-path: packages/vector/milvus
          run-mypy: 'true'
          mypy-target: '.'
          event-type: ${{ inputs.event-type }}

      - name: Start Milvus using official script
        # Pin the script to the release matching the pymilvus client (see
        # packages/vector/milvus lockfile) — fetching it from `master` made
        # this job hang for hours whenever upstream changed the script.
        timeout-minutes: 10
        run: |
          curl -sfL https://raw.githubusercontent.com/milvus-io/milvus/v2.6.2/scripts/standalone_embed.sh -o standalone_embed.sh
          timeout 480 bash standalone_embed.sh start
          echo "Milvus started with official script"

      - name: Wait for Milvus to be ready
        run: |
          echo "Waiting for Milvus container to be healthy..."
          for i in {1..60}; do
            # Check Docker container health status (like the script does)
            if sudo docker ps | grep milvus-standalone | grep healthy; then
              echo "Milvus container is healthy"
              break
            fi
            echo "Waiting for Milvus container to be healthy... (attempt $i/60)"
            sleep 5
          done
          
          # Double-check with health endpoint
          for i in {1..30}; do
            if curl -f http://localhost:9091/healthz 2>/dev/null; then
              echo "Milvus health endpoint is ready"
              break
            fi
            echo "Waiting for Milvus health endpoint... (attempt $i/30)"
            sleep 2
          done
          
          # Final verification
          curl -f http://localhost:9091/healthz || (echo "Milvus failed to start properly" && exit 1)

      - name: Run Milvus Example
        env:
          ENV: 'dev'
          ENABLE_BACKEND_ACCESS_CONTROL: False
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION }}
          VECTOR_DB_PROVIDER: 'milvus'
          VECTOR_DB_URL: 'http://localhost:19530'
        working-directory: ./packages/vector/milvus
        run: poetry run python examples/example.py

      - name: Run Milvus Tests
        env:
          ENV: 'dev'
          ENABLE_BACKEND_ACCESS_CONTROL: False
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_ENDPOINT: ${{ secrets.EMBEDDING_ENDPOINT }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_VERSION: ${{ secrets.EMBEDDING_API_VERSION }}
          VECTOR_DB_PROVIDER: 'milvus'
          VECTOR_DB_URL: 'http://localhost:19530'
        working-directory: ./packages/vector/milvus
        run: poetry run python tests/test_milvus.py