[project]
name = "cognee-community-connector-dropbox"
version = "0.1.0"
description = "Dropbox data-source connector for cognee — sync Dropbox folders into memory (incremental + forget-on-delete)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Requires table-scoped document cleanup (DOCUMENT_SYNC_VERSION),
    # PIPELINE_SCOPE_ATTR and guarded_rows, first shipped together in cognee 1.6.1.
    "cognee==1.6.3",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "dropbox>=12.0.0,<13",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_dropbox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
]
