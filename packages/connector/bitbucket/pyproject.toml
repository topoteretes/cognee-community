[project]
name = "cognee-community-connector-bitbucket"
version = "0.1.0"
description = "Bitbucket Cloud data-source connector for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "cognee==1.4.0",
    # Cognee's broader bound otherwise selects LanceDB releases without Intel macOS wheels.
    "lancedb>=0.24.3,<0.26; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "requests>=2.31.0,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_bitbucket"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
