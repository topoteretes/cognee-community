[project]
name = "cognee-community-vector-adapter-qdrant"
version = "0.4.1"
description = "Qdrant vector database adapter for cognee"
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "qdrant-client>=1.18.0",
    "cognee==1.5.4",
    # Transitive via cognee; pinned to the version cognee 1.5.4 locks, so CI
    # resolves the litellm the upstream release was tested against. cognee 1.5.x
    # caps the range itself (>=1.83.7,<1.97.0); 1.96.2 ships abi3 wheels that
    # install on every Python this package supports.
    "litellm==1.96.2",
    "starlette>=0.48.0",
    "instructor>=1.11"
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cognee_community_vector_adapter_qdrant*"]