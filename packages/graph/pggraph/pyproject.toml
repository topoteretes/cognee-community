[project]
name = "cognee-community-graph-adapter-pggraph"
version = "0.1.0"
description = "Experimental pgGraph graph database adapter for cognee"
authors = [
    {name = "Cognee Community"},
]
readme = "README.md"
requires-python = ">=3.10,<=3.13"
dependencies = [
    "cognee==1.4.1",
    "asyncpg>=0.29.0",
    "starlette>=0.48.0",
    "instructor>=1.11",
]

[project.urls]
Homepage = "https://github.com/Evokoa/pgGraph"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_graph_adapter_pggraph"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
